services:

  spark-master:
    image: apache/spark:3.5.7
    container_name: spark-master
    hostname: spark-master
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
      --host spark-master
      --port 7077
      --webui-port 8080
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./spark:/workspace/spark
      - ./results:/workspace/results
    networks:
      - big_data_pj_default

  spark-worker:
    image: apache/spark:3.5.7
    container_name: spark-worker
    hostname: spark-worker
    depends_on:
      - spark-master
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
      --webui-port 8081
    ports:
      - "8081:8081"
    volumes:
      - ./spark:/workspace/spark
      - ./results:/workspace/results
    networks:
      - big_data_pj_default

networks:
  big_data_pj_default:
    external: true